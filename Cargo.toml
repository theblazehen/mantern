[package]
name = "mantern"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "man pages as native UI in the Tern terminal"
license = "GPL-3.0-or-later"

[[bin]]
name = "mantern"
path = "src/main.rs"

[dependencies]
libmandoc-rs = { version = "0.10.0", features = ["render"] }
serde_json = "1"
libc = "0.2"
xz2 = "0.1"
bzip2 = "0.5"

[dev-dependencies]
libmandoc-rs = { version = "0.10.0", features = ["render", "serde"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
